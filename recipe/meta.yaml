{% set version = "1.5.1" %}

package:
  name: asn1crypto
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/a/asn1crypto/asn1crypto-{{ version }}.tar.gz
  sha256: 13ae38502be632115abf8a24cbe5f4da52e3b5231990aff31123c805306ccb9c

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
    - setuptools >=38.6.0
    - wheel >=0.31.0
  run:
    - python

test:
  imports:
    - asn1crypto
  requires:
    - pip
  commands:
    - pip check

about:
  home: https://github.com/wbond/asn1crypto
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Python ASN.1 library with a focus on performance and a pythonic API
  dev_url: https://github.com/wbond/asn1crypto
  doc_url: https://github.com/wbond/asn1crypto/blob/master/readme.md

extra:
  recipe-maintainers:
    - jschueller
    - ocefpaf
